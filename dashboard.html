<div class="rabbit-recent-books">

    <div class="rabbit-recent-books__tabs" data-role="library-tabs" role="tablist" aria-label="도서 라이브러리"></div>
    <div class="rabbit-recent-books__nav" aria-label="신규 도서 이동">
      <button type="button" class="rabbit-recent-books__nav-button" data-scroll="left" aria-label="이전 도서" title="이전">
        <span aria-hidden="true">‹</span>
      </button>
      <button type="button" class="rabbit-recent-books__nav-button" data-scroll="right" aria-label="다음 도서" title="다음">
        <span aria-hidden="true">›</span>
      </button>
    </div>
  </div>
  <div class="rabbit-recent-books__row" data-role="book-row" role="tabpanel" tabindex="0" aria-live="polite"></div>
</div>
